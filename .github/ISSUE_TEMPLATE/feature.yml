name: Feature request
description: A change to Frame's API or behavior.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What you are trying to do and cannot, or can only do with extra code.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you would like
      description: The API you would write, and how a provider would honor it. Frame states only what it knows, so say what could be known.
